<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f8f8fc" />
    <meta name="description" content="بازی حدس پرچم ۲۶۰ سرزمین جهان" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="تشخیص پرچم" />
    <title>تشخیص پرچم</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" id="favicon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;700;800&display=swap"
    /></noscript>

    <style>
      :root {
        --gold: #f5b042;
        --gold-d: #a97800;
        --gold-bg: #fdf3de;
        --blue: #4a9eff;
        --blue-bg: #e9f3ff;
        --green: #4caf50;
        --green-d: #2c7a33;
        --green-bg: #e9f5ea;
        --purple: #9b59b6;
        --purple-bg: #f4ecf9;
        --red: #e0534a;
        --red-bg: #fdeeee;
        --orange: #e07b2a;
        --orange-bg: #fff4e3;
        --teal: #0ea5a4;
        --teal-bg: #e3f6f5;
        --ink: #2b2f38;
        --ink-2: #71757f;
        --line: #e6e7ee;
        --bg: #f8f8fc;
        --card: #fff;
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --shadow: 0 8px 22px -12px rgba(43, 47, 56, 0.22);
        --f-body: "Vazirmatn", "Segoe UI", Tahoma, Arial, sans-serif;
        --f-num: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
        --pb: 0px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        font-family: var(--f-body);
        color: var(--ink);
        background: var(--bg);
        background-image: radial-gradient(
          rgba(43, 47, 56, 0.045) 1px,
          transparent 1.4px
        );
        background-size: 22px 22px;
        position: fixed;
        inset: 0;
        width: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        -webkit-user-drag: none;
        -ms-content-zooming: none;
        -ms-touch-action: none;
      }
      input {
        font-size: 16px;
        user-select: text;
        -webkit-user-select: text;
        touch-action: manipulation;
      }
      [hidden] {
        display: none !important;
      }
      img {
        -webkit-user-drag: none;
        pointer-events: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid rgba(74, 158, 255, 0.55);
        outline-offset: 2px;
      }
      .num {
        font-family: var(--f-num);
        font-weight: 400;
      }
      .svg-ic {
        width: 1em;
        height: 1em;
        fill: currentColor;
        flex: none;
        display: inline-block;
        vertical-align: -0.125em;
        pointer-events: none;
      }

      #app {
        height: 100vh;
        height: 100dvh;
        max-width: 520px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: manipulation;
      }
      @media (min-width: 540px) {
        #app {
          border-inline: 1px solid var(--line);
        }
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        touch-action: pan-y;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }

      /* ================= نوار بالا ================= */
      .topbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(7px + env(safe-area-inset-top)) 10px 7px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        z-index: 40;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        flex: none;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        transition: transform 0.25s var(--spring);
      }
      .icon-btn:active {
        transform: scale(0.86);
      }
      .icon-btn .svg-ic {
        width: 16px;
        height: 16px;
      }
      .tb-title {
        flex: 1;
        text-align: center;
        font-weight: 800;
        font-size: 14.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .score-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        background: var(--gold-bg);
        border: 1px solid #f0dcae;
        color: #7a5200;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 13px;
      }
      .score-chip .svg-ic {
        color: var(--gold);
        width: 12px;
        height: 12px;
      }
      .score-chip.pop {
        animation: pop 0.45s var(--spring);
      }
      @keyframes pop {
        40% {
          transform: scale(1.18);
        }
      }

      /* دکمهٔ بازی دوباره */
      #btn-restart {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        border: 1px solid #9ccdff;
        background: var(--blue-bg);
        color: #1a6ec4;
        padding: 8px 14px;
        font-weight: 800;
        font-size: 13px;
        transition: transform 0.25s var(--spring);
        animation: rpulse 2.5s infinite;
      }
      @keyframes rpulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.35);
        }
        60% {
          box-shadow: 0 0 0 7px rgba(74, 158, 255, 0);
        }
      }
      #btn-restart:active {
        transform: rotate(-180deg) scale(0.86);
        transition: transform 0.4s var(--spring);
      }
      #btn-restart .svg-ic {
        width: 14px;
        height: 14px;
      }

      /* دکمهٔ صدا */
      #btn-sound {
        border-color: #f0dcae;
        background: var(--gold-bg);
        color: #7a5200;
      }
      #btn-sound.off {
        border-color: var(--line);
        background: #fff;
        color: #8f97a6;
      }
      .eq {
        display: flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 15px;
        width: 18px;
        position: relative;
      }
      .eq i {
        flex: 1;
        border-radius: 2px;
        background: var(--gold);
        height: 100%;
        transform-origin: bottom;
        animation: eqb 1s ease-in-out infinite;
      }
      .eq i:nth-child(1) {
        animation-duration: 0.9s;
      }
      .eq i:nth-child(2) {
        animation-duration: 0.68s;
        animation-delay: 0.1s;
      }
      .eq i:nth-child(3) {
        animation-duration: 1.1s;
        animation-delay: 0.05s;
      }
      .eq i:nth-child(4) {
        animation-duration: 0.78s;
        animation-delay: 0.18s;
      }
      @keyframes eqb {
        0%,
        100% {
          transform: scaleY(0.3);
        }
        50% {
          transform: scaleY(1);
        }
      }
      .eq.off i {
        background: #b3b9c6;
        animation: none;
      }
      .eq.off i:nth-child(1) {
        transform: scaleY(0.3);
      }
      .eq.off i:nth-child(2) {
        transform: scaleY(0.62);
      }
      .eq.off i:nth-child(3) {
        transform: scaleY(0.22);
      }
      .eq.off i:nth-child(4) {
        transform: scaleY(0.48);
      }
      .eq.off::after {
        content: "";
        position: absolute;
        left: -3px;
        right: -3px;
        top: 50%;
        height: 2.5px;
        background: #8f97a6;
        border-radius: 99px;
        transform: rotate(-34deg);
      }

      /* ================= صفحات ================= */
      main {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .page {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }
      .page.active {
        display: flex;
        animation: pageIn 0.32s var(--spring);
      }
      @keyframes pageIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      /* ================= دکمه‌ها ================= */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        font-size: 15.5px;
        font-weight: 800;
        padding: clamp(11px, 1.9dvh, 15px) 16px;
        border-radius: 14px;
        border: 2px solid transparent;
        transition:
          transform 0.22s var(--spring),
          box-shadow 0.25s,
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn .svg-ic {
        width: 17px;
        height: 17px;
      }
      .btn-gold {
        background: var(--gold);
        color: #4a3200;
        box-shadow: 0 5px 14px -6px rgba(245, 176, 66, 0.65);
      }
      .btn-blue {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 5px 14px -6px rgba(74, 158, 255, 0.6);
      }
      .btn-ghost {
        background: #fff;
        border-color: var(--line);
        color: var(--ink);
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-sm {
        width: auto;
        padding: 9px 18px;
        font-size: 14px;
        border-radius: 11px;
      }

      /* ================= خانه ================= */
      #page-home .scroll {
        display: flex;
      }
      .hero {
        margin: auto 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 12px 16px calc(20px + var(--pb) + env(safe-area-inset-bottom));
      }
      .logo {
        width: clamp(84px, 14dvh, 124px);
        filter: drop-shadow(0 12px 18px rgba(43, 47, 56, 0.24));
        animation: float 5s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-8px);
        }
      }
      .logo-svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .logo .cloth {
        transform-box: fill-box;
        transform-origin: 0% 30%;
        animation: sway 3.8s ease-in-out infinite;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-1.5deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }
      .logo .lens {
        transform-box: fill-box;
        transform-origin: center;
        animation: lensFloat 3.8s ease-in-out infinite;
      }
      @keyframes lensFloat {
        50% {
          transform: translateY(2.4px);
        }
      }
      .hero h1 {
        font-family: var(--f-num);
        font-weight: 400;
        font-size: clamp(26px, 4.6dvh, 36px);
        line-height: 1.3;
        margin-top: 5px;
      }
      .divider {
        width: 50px;
        height: 4px;
        border-radius: 99px;
        background: var(--gold);
        margin-top: 3px;
      }
      .hero .sub {
        color: var(--ink-2);
        font-size: 12.5px;
        margin-top: 9px;
        line-height: 1.8;
        max-width: 330px;
      }
      .flag-row {
        display: flex;
        margin: clamp(8px, 1.8dvh, 16px) 0 0;
      }
      .flag-row img {
        width: 42px;
        height: 30px;
        object-fit: cover;
        border-radius: 7px;
        border: 2.5px solid #fff;
        box-shadow: 0 3px 8px rgba(43, 47, 56, 0.22);
        margin-inline-end: -10px;
        opacity: 0;
        transition: transform 0.3s var(--spring);
      }
      .flag-row img.ok {
        opacity: 1;
      }
      .flag-row img:nth-child(odd) {
        transform: rotate(-6deg);
      }
      .flag-row img:nth-child(even) {
        transform: rotate(5deg) translateY(3px);
      }
      .cta {
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: 100%;
        margin-top: clamp(12px, 2dvh, 18px);
      }
      .stats {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: clamp(9px, 1.6dvh, 14px) 6px;
        margin-top: clamp(10px, 1.8dvh, 16px);
        box-shadow: var(--shadow);
      }
      .stat {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stat b {
        font-family: var(--f-num);
        font-size: clamp(17px, 2.8dvh, 23px);
        line-height: 1.15;
      }
      .stat b small {
        font-size: 12px;
        color: var(--ink-2);
      }
      .stat span {
        font-size: 10.5px;
        color: var(--ink-2);
      }
      .vr {
        width: 1px;
        height: 30px;
        background: var(--line);
        flex: none;
      }
      .link-danger {
        color: #b3564e;
        font-size: 12px;
        margin-top: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
        opacity: 0.8;
      }
      .link-danger .svg-ic {
        width: 13px;
        height: 13px;
      }

      .daily {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 14px;
        border: 2px dashed var(--gold);
        background: #fff;
        margin-top: clamp(10px, 1.8dvh, 16px);
        transition: transform 0.22s var(--spring);
      }
      .daily:active {
        transform: scale(0.98);
      }
      .daily .d-ic {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: var(--gold-bg);
        color: #9a6c00;
        display: grid;
        place-items: center;
        flex: none;
      }
      .daily .d-ic .svg-ic {
        width: 17px;
        height: 17px;
      }
      .daily .d-tx {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
        text-align: right;
      }
      .daily .d-tx b {
        font-size: 13px;
        font-weight: 800;
      }
      .daily .d-tx span {
        font-size: 10.5px;
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .daily .d-badge {
        flex: none;
        background: var(--gold);
        color: #4a3200;
        font-size: 11px;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 99px;
      }
      .daily.done {
        border-style: solid;
        border-color: #b7dfb9;
        background: var(--green-bg);
      }
      .daily.done .d-ic {
        background: #d9efd9;
        color: var(--green-d);
      }
      .daily.done .d-badge {
        background: var(--green);
        color: #fff;
      }

      .tools {
        display: flex;
        gap: 9px;
        width: 100%;
        margin-top: 9px;
      }
      .tool {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 9px 8px;
        font-size: 13px;
        font-weight: 800;
        color: var(--ink);
        transition: transform 0.22s var(--spring);
      }
      .tool .svg-ic {
        width: 15px;
        height: 15px;
        color: var(--ink-2);
      }
      .tool:active {
        transform: scale(0.97);
      }
      .tool .cnt {
        background: var(--gold-bg);
        color: #7a5200;
        border-radius: 99px;
        padding: 1px 8px;
        font-size: 11px;
      }

      /* ================= مراحل ================= */
      .stages-head {
        flex: none;
        padding: 12px 16px 10px;
      }
      .stage-progress {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }
      .sp-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      .sp-row b {
        color: var(--ink);
        font-size: 14.5px;
      }
      .bar {
        height: 7px;
        background: #eef0f6;
        border-radius: 99px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--gold);
        border-radius: 99px;
        transition: width 0.6s var(--spring);
      }
      .bar.slim {
        height: 5px;
      }
      .grid-wrap {
        padding: 10px 16px calc(26px + var(--pb));
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
        gap: 9px;
      }

      .cell {
        position: relative;
        aspect-ratio: 3/2;
        border-radius: 12px;
        border: 2px solid;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        overflow: hidden;
        color: var(--ink);
        transition: transform 0.25s var(--spring);
      }
      .cell:active {
        transform: scale(0.93);
      }
      .num-chip {
        position: absolute;
        top: 4px;
        right: 5px;
        z-index: 2;
        font-family: var(--f-num);
        font-size: 10.5px;
        line-height: 1;
        padding: 2.5px 6px;
        border-radius: 7px;
        background: rgba(24, 28, 38, 0.55);
        color: #fff;
      }
      .cell .big {
        display: flex;
        line-height: 1;
      }
      .cell .st-ic {
        position: absolute;
        bottom: 4px;
        left: 5px;
        display: flex;
        opacity: 0.9;
      }
      .cell .st-ic .svg-ic {
        width: 11px;
        height: 11px;
      }
      .cell.locked {
        background: #fbf8ee;
        border-style: dashed;
        border-color: #eadfb7;
      }
      .cell.locked .big {
        font-family: var(--f-num);
        font-size: 19px;
        color: #c9b786;
      }
      .cell.locked .st-ic {
        color: #d9b96a;
      }
      .cell.open {
        background: var(--blue-bg);
        border-color: #9ccdff;
        animation: cellPulse 2.4s infinite;
      }
      @keyframes cellPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.45);
        }
        70%,
        100% {
          box-shadow: 0 0 0 9px rgba(74, 158, 255, 0);
        }
      }
      .cell.open .big {
        font-family: var(--f-num);
        font-size: 25px;
        color: #1e63c4;
      }
      .cell.open .st-ic {
        color: var(--blue);
      }
      .cell.done {
        background: #fff;
        border-color: #bfe3c0;
      }
      .cell.done .mini {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cell .tick {
        position: absolute;
        bottom: 4px;
        left: 4px;
        z-index: 2;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        color: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-10deg);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
      }
      .cell .tick .svg-ic {
        width: 11px;
        height: 11px;
      }
      .cell .tick.gold {
        color: var(--gold-d);
        box-shadow:
          0 0 0 2.5px rgba(245, 176, 66, 0.45),
          0 1px 4px rgba(0, 0, 0, 0.2);
      }
      .cell.special {
        background: var(--purple-bg);
        border-color: #d5b8e3;
      }
      .cell.special .big {
        color: #8e44ad;
        animation: crownPulse 1.8s infinite;
      }
      .cell.special .big .svg-ic {
        width: 24px;
        height: 24px;
      }
      @keyframes crownPulse {
        50% {
          transform: scale(1.22);
        }
      }

      /* ================= بازی / چالش ================= */
      .game-top {
        flex: none;
        padding: 10px 16px 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .game-meta {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .game-cap {
        font-size: 12px;
        color: var(--ink-2);
      }
      .game-cap b {
        color: var(--ink);
      }
      .flag-card {
        position: relative;
        width: min(100%, 34dvh, 336px);
        margin-inline: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 8px;
        box-shadow: var(--shadow);
      }
      .flag-card img {
        width: 100%;
        aspect-ratio: 3/2;
        object-fit: cover;
        border-radius: 9px;
        display: block;
        background: #eceef4;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .flag-card img.ok {
        opacity: 1;
      }
      .question {
        font-size: 15px;
        font-weight: 800;
        text-align: center;
      }
      .game-bottom {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 0 16px calc(12px + var(--pb));
        touch-action: pan-y;
      }
      .game-bottom::-webkit-scrollbar {
        display: none;
      }
      .game-inner {
        margin: auto 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .opt {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        text-align: right;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 13px;
        padding: 8px 13px;
        min-height: clamp(48px, 7.6dvh, 76px);
        max-height: 86px;
        font-size: 15.5px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.55;
        transition:
          border-color 0.18s,
          background 0.18s,
          transform 0.18s var(--spring);
        animation: optIn 0.32s var(--spring) both;
      }
      .opt:nth-child(2) {
        animation-delay: 0.05s;
      }
      .opt:nth-child(3) {
        animation-delay: 0.1s;
      }
      .opt:nth-child(4) {
        animation-delay: 0.15s;
      }
      @keyframes optIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
      }
      .opt .tag {
        width: 29px;
        height: 29px;
        flex: none;
        border-radius: 9px;
        background: #f1f2f7;
        display: grid;
        place-items: center;
        font-family: var(--f-num);
        font-size: 15px;
        color: var(--ink-2);
      }
      .opt:not(:disabled):active {
        transform: scale(0.98);
      }
      .opt:disabled {
        cursor: default;
      }
      .opt.dim {
        opacity: 0.45;
      }
      .opt.correct {
        background: var(--green-bg);
        border-color: var(--green);
        color: var(--green-d);
      }
      .opt.correct .tag {
        background: var(--green);
        color: #fff;
      }
      .opt.wrong {
        background: var(--red-bg);
        border-color: var(--red);
        color: #a33a30;
        animation: shake 0.38s;
      }
      .opt.wrong .tag {
        background: var(--red);
        color: #fff;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(5px);
        }
        40%,
        80% {
          transform: translateX(-5px);
        }
      }
      .opt.hinted {
        border-color: var(--gold);
        border-style: dashed;
        background: var(--gold-bg);
      }
      .opt.hinted .tag {
        background: var(--gold);
        color: #4a3200;
      }
      .opt .mark {
        margin-inline-start: auto;
        background: var(--gold);
        color: #4a3200;
        font-size: 10.5px;
        font-weight: 800;
        padding: 3px 10px;
        border-radius: 99px;
        line-height: 1.5;
      }
      .opt.correct .mark,
      .opt.wrong .mark {
        display: none;
      }
      .opt.flag-opt {
        justify-content: center;
        gap: 16px;
      }
      .opt.flag-opt .fimg {
        width: 62px;
        height: 42px;
        object-fit: cover;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #eceef4;
      }

      .compare {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1.5px dashed var(--red);
        border-radius: 13px;
        padding: 9px 12px;
        animation: cIn 0.35s var(--spring);
      }
      .compare img {
        width: 62px;
        height: 42px;
        object-fit: cover;
        border-radius: 7px;
        flex: none;
      }
      .compare span {
        font-size: 12.5px;
        color: #a33a30;
        line-height: 1.7;
        font-weight: 700;
      }
      @keyframes cIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
      }

      .btn-hint {
        width: 100%;
        background: #fff;
        border: 2px dashed var(--gold);
        color: #9a6c00;
        font-size: 14px;
        font-weight: 800;
        padding: 11px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition:
          transform 0.22s var(--spring),
          background 0.2s,
          opacity 0.2s;

      .btn-hint .svg-ic {
        width: 16px;
        height: 16px;
      }
      .btn-hint:not(:disabled):active {
        transform: scale(0.98);
      }
      .btn-hint:disabled {
        opacity: 0.45;
        border-color: var(--line);
        color: var(--ink-2);
      }

      /* حالت تایپی */
      .type-box {
        display: flex;
        flex-direction: column;
        gap: 9px;
        animation: optIn 0.32s var(--spring);
      }
      .type-hint {
        font-size: 12px;
        color: var(--ink-2);
        text-align: center;
        background: #f6f7fb;
        border-radius: 10px;
        padding: 7px 10px;

      .type-hint.reveal {
        color: var(--red);

      }
      .type-row {
        display: flex;
        gap: 9px;
      }
      #type-input {
        flex: 1;
        min-width: 0;
        font-family: var(--f-body);
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        background: #fff;
        border: 2px solid var(--line);

        padding: 11px 14px;

        text-align: right;
        transition:
          border-color 0.2s,
          background 0.2s;

      #type-input:focus {
        outline: none;
        border-color: var(--gold);
      }
      #type-input.good {
        border-color: var(--green);
        background: var(--green-bg);
        color: var(--green-d);
      }
      #type-input.badflash {
        border-color: var(--red);
        background: var(--red-bg);
        animation: shake 0.38s;
      }
      #type-input:disabled {
        opacity: 0.75;
      }
      .type-send {
        flex: none;
        width: 52px;
        border-radius: 13px;
        background: var(--teal);

        display: grid;
        place-items: center;

          transform 0.2s var(--spring),
          opacity 0.2s;
      }
      .type-send .svg-ic {
        width: 20px;
        height: 20px;
      }
      .type-send:active {
        transform: scale(0.92);
      }
      .type-send:disabled {
        opacity: 0.45;
      }
      .type-skip {
        background: #fff;
        border: 1.5px dashed var(--line);
        color: var(--ink-2);

        font-weight: 800;
        padding: 9px;
        border-radius: 11px;
        width: 100%;
        transition: opacity 0.2s;
      }
      .type-skip:disabled {
        opacity: 0.45;
      }

      /* سرصفحهٔ چالش */
      .ch-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .timer {
        position: relative;
        width: 60px;
        height: 60px;
        flex: none;
      }
      .timer svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .tr-bg {
        fill: none;
        stroke: #e6e8f1;
        stroke-width: 5;
      }
      .tr-fg {
        fill: none;
        stroke: var(--gold);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 125.66;
        stroke-dashoffset: 0;
        transition:
          stroke-dashoffset 0.25s linear,
          stroke 0.3s;
      }
      .timer b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 19px;
      }
      .timer.low .tr-fg {
        stroke: var(--red);
      }
      .timer.low b {
        color: var(--red);
        animation: tick 0.55s infinite;
      }
      @keyframes tick {
        50% {
          transform: scale(1.16);
        }
      }
      .ch-meta {
        flex: 1;
        display: flex;
        gap: 8px;
      }
      .ch-box {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--line);

        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      .ch-box span {
        font-size: 10.5px;
        color: var(--ink-2);
      }

        font-family: var(--f-num);
        font-size: 20px;
        line-height: 1.2;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .ch-box b.pop {
        animation: pop 0.45s var(--spring);
      }
      #combo-box.fire {
        background: var(--orange-bg);
        border-color: #f3c268;
      }
      #combo-box.fire b {
        color: #c96a00;
      }
      .xmul {
        font-style: normal;
        font-size: 10px;
        background: var(--gold);
        color: #4a3200;
        border-radius: 99px;
        padding: 1px 7px;
        font-weight: 800;
      }

      .prompt-card {
        position: relative;
        width: min(100%, 30dvh, 300px);
        margin-inline: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 14px 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;

      .p-sub .svg-ic {
        width: 12px;
        height: 12px;

      .p-main {
        font-family: var(--f-num);

        width: min(100%, 28dvh, 290px);
      }
      #page-challenge .question {
        font-size: 14.5px;
      }
      #page-challenge .opt {
        font-size: 15px;
        min-height: clamp(46px, 7.2dvh, 72px);
      }

      .floatpt {
        position: absolute;
        top: 6px;
        left: 50%;
        font-family: var(--f-num);
        font-size: 24px;
        color: var(--green);
        text-shadow: 0 2px 6px rgba(255, 255, 255, 0.9);
        animation: fp 1s ease-out forwards;
        pointer-events: none;
        z-index: 5;
      }
      .floatpt.red {
        color: var(--red);
      }
      @keyframes fp {
        0% {
          opacity: 0;
          transform: translate(-50%, 8px) scale(0.7);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -2px) scale(1.1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -44px) scale(1);
        }
      }
      .tdelta {
        position: absolute;
        top: -7px;
        left: -6px;
        font-family: var(--f-num);
        font-size: 15px;
        pointer-events: none;
        animation: fp2 0.9s forwards;
        z-index: 5;
      }
      .tdelta.up {
        color: var(--green-d);
      }
      .tdelta.down {
        color: var(--red);
      }
      @keyframes fp2 {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-18px);
        }
      }

      /* ================= مودال ================= */
      .modal-bk {
        position: fixed;
        inset: 0;
        background: rgba(28, 30, 38, 0.5);
        z-index: 100;
        padding: 20px;
        display: grid;
        place-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .modal-bk.show {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border-radius: 22px;
        padding: 22px 18px;
        text-align: center;
        max-height: 86vh;
        overflow: auto;
        scrollbar-width: none;
        transform: translateY(24px) scale(0.93);
        transition: transform 0.35s var(--spring);
        box-shadow: 0 28px 55px -18px rgba(0, 0, 0, 0.4);
      }
      .modal-card::-webkit-scrollbar {
        display: none;
      }
      .modal-bk.show .modal-card {
        transform: none;
      }
      .stamp {
        position: relative;
        width: 84px;
        height: 84px;
        margin: 0 auto 12px;
        border-radius: 50%;
        border: 3px solid var(--green);
        color: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-12deg);
        animation: stampBig 0.55s var(--spring);
      }
      .stamp::after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        opacity: 0.45;
      }
      .stamp .in {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        gap: 2px;
      }
      .stamp .in b {
        font-family: var(--f-num);
        font-size: 28px;
      }
      .stamp .in small {
        font-size: 10px;
        font-weight: 800;
      }
      .stamp .in .svg-ic {
        width: 32px;
        height: 32px;
      }
      .stamp.gold {
        border-color: var(--gold);
        color: var(--gold-d);
      }
      .stamp.purple {
        border-color: var(--purple);
        color: var(--purple);
      }
      @keyframes stampBig {
        0% {
          transform: scale(1.9) rotate(9deg);
          opacity: 0;
        }
        55% {
          transform: scale(0.92) rotate(-15deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(-12deg);
        }
      }
      .m-warn {

        width: 42px;

      .m-score {

        font-size: 12px;
        font-weight: 800;
        color: var(--ink-2);
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
        text-align: right;
      }
      .sec-t .svg-ic {
        width: 13px;
        height: 13px;
      }

      .toast {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom) + var(--pb));
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background: var(--ink);
        color: #fff;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        z-index: 120;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s var(--spring);
        display: flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
        max-width: 92vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast .svg-ic {
        width: 15px;
        height: 15px;
      }
      .confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 130;
        overflow: hidden;
      }
      .confetti i {
        position: absolute;
        top: -16px;
        height: 13px;
        border-radius: 2px;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translateY(112vh) rotate(740deg);
        }
      }

      @media (max-height: 660px) {
        .logo {
          width: clamp(72px, 12dvh, 94px);

        .hero .sub {

      /* ================= ذخیره‌سازی ================= */
      const LS_KEY = "flaggame.app";

      function save() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(S));

      function clampInt(v, lo, hi) {
        v = parseInt(v, 10);
        return isNaN(v) ? lo : Math.min(hi, Math.max(lo, v));
      }
      function makeOrder() {
        return shuffle(Array.from({ length: TOTAL }, (_, i) => i));
      }
      function validOrder(o) {
        if (!Array.isArray(o) || o.length !== TOTAL) return false;
        const s = new Uint8Array(TOTAL);
        for (let i = 0; i < o.length; i++) {
          const v = o[i];
          if (
            typeof v !== "number" ||
            !Number.isInteger(v) ||
            v < 0 ||
            v >= TOTAL ||
            s[v]
          )
            return false;
          s[v] = 1;
        }
        return true;
      }
      function loadState() {
        let src = null;
        ["flaggame.app", "flaggame.pwa", "flaggame.final"].forEach((k) => {
          if (src) return;
          try {
            src = JSON.parse(localStorage.getItem(k));
          } catch (e) {}
        });
        S.done = clampInt(src && src.done, 0, TOTAL);
        S.score = clampInt(src && src.score, 0, 9999999);
        S.best = clampInt(src && src.best, 0, 9999);
        S.bestRev = clampInt(src && src.bestRev, 0, 9999);

        S.bestType = clampInt(src && src.bestType, 0, 9999);
        S.bestCombo = clampInt(src && src.bestCombo, 0, 9999);
        S.order = src && validOrder(src.order) ? src.order : makeOrder();
        S.mute = !!(src && src.mute);
        S.flawless = Array.isArray(src && src.flawless)

              .filter((x) => Number.isInteger(x) && x >= 0 && x < TOTAL)
              .slice(0, TOTAL)
          : [];
        S.badges =
          src && src.badges && typeof src.badges === "object" && src.badges

          src && src.daily && typeof src.daily === "object"
            ? { d: String(src.daily.d || ""), s: clampInt(src.daily.s, 0, 10) }
            : { d: "", s: 0 };
        S.dailyRun =
          src &&

          typeof src.dailyRun.d === "string"
            ? {

        S.dailyTotal = clampInt(src && src.dailyTotal, 0, 9999);
        S.streak = clampInt(src && src.streak, 0, 9999);
        S.lastD = src && typeof src.lastD === "string" ? src.lastD : "";

      /* ================= صدا ================= */
      let AC = null;
      function beep(kind) {
        if (S.mute) return;
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === "suspended") AC.resume();
          const o = AC.createOscillator(),
            g = AC.createGain(),
            t = AC.currentTime;
          o.connect(g);
          g.connect(AC.destination);
          if (kind === "ok") {
            o.frequency.setValueAtTime(660, t);
            o.frequency.setValueAtTime(880, t + 0.09);
          } else if (kind === "bad") {
            o.frequency.setValueAtTime(220, t);
            o.frequency.setValueAtTime(165, t + 0.11);
          } else if (kind === "combo") {
            o.frequency.setValueAtTime(523, t);
            o.frequency.setValueAtTime(659, t + 0.07);
            o.frequency.setValueAtTime(784, t + 0.14);
            o.frequency.setValueAtTime(1046, t + 0.21);
          } else {
            o.frequency.setValueAtTime(523, t);
            o.frequency.setValueAtTime(659, t + 0.12);
            o.frequency.setValueAtTime(784, t + 0.24);
          }
          g.gain.setValueAtTime(0.11, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
          o.start(t);
          o.stop(t + 0.36);
        } catch (e) {}
      }

      /* ================= پرچم‌ها ================= */
      function rng2(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function procedural(idx) {
        const r = rng2(idx * 97 + 13);
        const pal = [
          "#c9302c",
          "#1b5faa",
          "#2e8b4f",
          "#f0b429",
          "#ffffff",
          "#20242c",
          "#7d3f9e",
          "#e07b2a",
          "#2c9db3",
        ];
        const pick = [];
        while (pick.length < 4) {
          const k = Math.floor(r() * pal.length);
          if (pick.indexOf(k) < 0) pick.push(k);
        }
        const c = pick.map((k) => pal[k]);
        const p = Math.floor(r() * 5);
        let b = '<rect width="300" height="200" fill="' + c[0] + '"/>';
        if (p === 1)
          b += '<rect y="67" width="300" height="66" fill="' + c[1] + '"/>';
        else if (p === 2)
          b += '<rect width="100" height="200" fill="' + c[1] + '"/>';
        else if (p === 3)
          b += '<circle cx="150" cy="100" r="40" fill="' + c[1] + '"/>';
        else if (p === 4)
          b += '<path d="M0 0 L120 100 L0 200 Z" fill="' + c[1] + '"/>';
        return (
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">' +
              b +
              "</svg>",
          )
        );
      }
      const flagCache = new Array(TOTAL);
      function applyFlag(img, idx, fade) {
        if (!img) return;
        img.onload = null;
        img.onerror = null;
        const cached = flagCache[idx];
        if (cached) {
          img.src = cached;
          if (fade) img.classList.add("ok");
          return;
        }
        if (fade) img.classList.remove("ok");
        img.onload = function () {
          img.onload = img.onerror = null;
          flagCache[idx] = img.src;
          if (fade) img.classList.add("ok");
        };
        img.onerror = function () {
          img.onload = img.onerror = null;
          flagCache[idx] = procedural(idx);
          img.src = flagCache[idx];
          if (fade) img.classList.add("ok");
        };
        img.src = "svg/" + COUNTRIES[idx][1] + ".svg";
      }

      /* ================= آلبوم ================= */
      const gridEl = $("#grid");
      const ST_FA = {
        locked: "قفل",
        open: "باز",
        done: "کامل",
        special: "ویژه",
      };
      function buildGrid() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < TOTAL; i++) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "cell";
          b.dataset.i = i;
          b.dataset.s = "";
          frag.appendChild(b);
        }

      }
      function stateOf(i) {
        if (S.done >= TOTAL) return i === TOTAL - 1 ? "special" : "done";
        if (i < S.done) return "done";
        if (i === S.done) return "open";
        return "locked";
      }
      function paintCell(i, force) {
        const cell = gridEl.children[i];
        if (!cell) return;
        const st = stateOf(i);
        if (!force && cell.dataset.s === st) return;
        cell.dataset.s = st;
        cell.className = "cell " + st;
        cell.setAttribute(
          "aria-label",
          "مرحله " + faNum(i + 1) + "، " + ST_FA[st],
        );
        const num = faNum(i + 1);
        if (st === "locked")
          cell.innerHTML =
            '<span class="big">' +
            num +
            '</span><span class="st-ic">' +
            ic("lock") +
            "</span>";
        else if (st === "open")

      function refreshGrid() {
        for (let i = 0; i < TOTAL; i++) paintCell(i);
        updateStagesMeta();

      function updateStagesMeta() {
        $("#sp-text").textContent = faNum(S.done) + " از " + faNum(TOTAL);
        $("#sp-fill").style.width = ((S.done / TOTAL) * 100).toFixed(2) + "%";
        $("#continue-label").textContent =
          S.done < TOTAL ? "ادامه: مرحله " + faNum(S.done + 1) : "سفر کامل شد";
      }

      /* ================= گزینه‌ها ================= */
      const TAGS = ["الف", "ب", "ج", "د"];
      function getDistractors(ci, smart) {
        const out = [];
        if (smart !== "none") {
          const g = groupOf[COUNTRIES[ci][1]];
          if (g) {
            const cand = shuffle(g.filter((x) => x !== ci));
            const n = smart === "one" ? 1 : 3;
            for (let k = 0; k < cand.length && out.length < n; k++)
              out.push(cand[k]);
          }
        }
        let guard = 0;
        while (out.length < 3 && guard++ < 400) {
          const r = (Math.random() * TOTAL) | 0;
          if (r !== ci && out.indexOf(r) < 0) out.push(r);
        }
        return out.slice(0, 3);
      }
      function buildNameOptions(box, ci, dis, onPick) {
        const right = COUNTRIES[ci][0];
        const names = new Set([right]);
        dis.forEach((d) => names.add(COUNTRIES[d][0]));
        let guard = 0;
        while (names.size < 4 && guard++ < 300)
          names.add(COUNTRIES[(Math.random() * TOTAL) | 0][0]);
        for (let i = 0; i < TOTAL && names.size < 4; i++)
          names.add(COUNTRIES[i][0]);
        const list = shuffle(Array.from(names));
        box.innerHTML = "";
        list.forEach((nm, k) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.dataset.nm = nm;
          b.innerHTML =
            '<span class="tag">' + TAGS[k] + "</span><span>" + nm + "</span>";
          b.addEventListener("click", () => onPick(b, nm));
          box.appendChild(b);
        });
      }
      function buildFlagOptions(box, ci, dis, onPick) {
        const arr = shuffle([ci].concat(dis));
        box.innerHTML = "";
        arr.forEach((idx, k) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opt flag-opt";
          b.dataset.idx = idx;
          b.innerHTML =
            '<span class="tag">' + TAGS[k] + '</span><img class="fimg" alt="">';
          applyFlag(b.querySelector(".fimg"), idx);
          b.addEventListener("click", () => onPick(b, idx));
          box.appendChild(b);
        });
      }

      /* ================= بازی مرحله‌ای ================= */
      function hideCompare() {
        const c = $("#g-compare");
        c.hidden = true;
        c.innerHTML = "";
      }
      function showCompare(wrongName) {
        const wi = COUNTRIES.findIndex((c) => c[0] === wrongName);
        if (wi < 0) return;
        const box = $("#g-compare");
        box.hidden = false;
        box.innerHTML =
          '<img alt=""><span>پرچمِ «' +
          wrongName +
          "» این‌گونه است — با پرچم بالا مقایسه کن</span>";
        applyFlag(box.querySelector("img"), wi);
      }
      function stageCap() {
        let s =
          'پرچم شماره <b class="num">' +
          faNum(GAME.stage + 1) +
          '</b> از <b class="num">' +
          faNum(TOTAL) +
          "</b>";
        if (GAME.mistakes > 0)
          s += ' • خطا: <b class="num">' + faNum(GAME.mistakes) + "</b>";
        $("#g-cap").innerHTML = s;

      function markHint() {
        const right = COUNTRIES[GAME.cur][0];
        const hb = Array.from($("#g-options").children).find(
          (b) => b.dataset.nm === right,
        );
        if (hb && !hb.classList.contains("hinted")) {
          hb.classList.add("hinted");
          hb.insertAdjacentHTML(
            "beforeend",
            '<span class="mark">پاسخ درست</span>',

      function openGame(i) {
        if (i == null || i < 0 || i >= TOTAL) {
          showPage("home");
          return;
        }
        GAME = {
          kind: "stage",
          seq: GAME.seq + 1,
          stage: i,
          cur: S.order[i],
          mistakes: 0,
          answered: false,
          hints: 0,
        };
        if (i === S.done && S.attempt) {
          GAME.mistakes = clampInt(S.attempt.m, 0, 99);
          GAME.hints = S.attempt.h ? 1 : 0;
        }
        nav("game");
        stageCap();
        $("#gp-fill").style.width = ((S.done / TOTAL) * 100).toFixed(2) + "%";
        applyFlag($("#g-flag"), GAME.cur, true);
        hideCompare();
        $("#btn-hint").hidden = false;
        refreshHint();
        buildNameOptions(
          $("#g-options"),
          GAME.cur,
          getDistractors(GAME.cur, i >= 5 ? "full" : "none"),
          gamePick,
        );
        if (GAME.hints > 0) markHint();
      }
      function gamePick(btn, name) {
        if (
          GAME.answered ||
          btn.disabled ||
          curPage !== "game" ||
          GAME.kind !== "stage"
        )
          return;
        const right = COUNTRIES[GAME.cur][0];
        S.stats.a++;
        if (name !== right) {
          S.wrongs[COUNTRIES[GAME.cur][1]] =
            (S.wrongs[COUNTRIES[GAME.cur][1]] || 0) + 1;
          GAME.mistakes++;
          beep("bad");
          vib([50, 60, 50]);
          btn.classList.add("wrong");
          btn.disabled = true;
          showCompare(name);
          stageCap();
          S.attempt = { m: GAME.mistakes, h: GAME.hints };
          save();
          refreshHint();
          return;
        }
        S.stats.c++;
        GAME.answered = true;
        const pts = GAME.mistakes === 0 ? 10 : GAME.mistakes === 1 ? 7 : 4;
        const idx = GAME.stage;
        if (GAME.mistakes === 0 && S.flawless.indexOf(idx) < 0)
          S.flawless.push(idx);
        if (S.done <= idx) {
          S.done = idx + 1;
          S.score += pts;
        }
        S.attempt = null;
        save();
        paintScore(true);
        beep("ok");
        vib(25);
        floatPts($("#g-flagcard"), "+" + faNum(pts));
        hideCompare();
        refreshHint();
        $("#gp-fill").style.width = ((S.done / TOTAL) * 100).toFixed(2) + "%";
        paintCell(idx, true);
        if (S.done < TOTAL) paintCell(S.done, true);
        updateStagesMeta();
        checkBadges();
        const arr = Array.from($("#g-options").children);
        arr.forEach((b) => {
          b.disabled = true;
          if (b !== btn) b.classList.add("dim");

        setTimeout(() => {
          if (seq === GAME.seq && curPage === "game")
            winModal(idx, S.done >= TOTAL);
        }, 700);
      }

      function finalModal() {
        confetti(120);

            '<p class="m-text">تاج قهرمانی از آنِ توست!</p>' +

      /* ---------- راهنمایی ---------- */
      function refreshHint() {
        const b = $("#btn-hint"),
          l = $("#hint-label");
        if (GAME.kind !== "stage" || GAME.answered) {
          b.disabled = true;
          l.textContent = "حل شد";
          return;
        }
        if (GAME.hints > 0) {
          b.disabled = true;
          l.textContent = "پاسخ مشخص شد";
          return;
        }
        if (GAME.mistakes >= 3) {
          b.disabled = false;
          l.textContent = "نمایش پاسخ (رایگان)";
          return;
        }
        b.disabled = S.score < 50;
        l.textContent = "نمایش پاسخ درست (۵۰ امتیاز)";
      }
      function useHint() {
        if (GAME.answered || GAME.hints > 0 || GAME.kind !== "stage") return;
        const free = GAME.mistakes >= 3;
        if (!free) {
          if (S.score < 50) {
            toast("۵۰ امتیاز لازم داری", "bulb");
            return;
          }
          S.score -= 50;
        }
        GAME.hints = 1;
        S.attempt = { m: GAME.mistakes, h: 1 };
        save();
        paintScore(false);
        refreshHint();
        markHint();
      }

      /* ================= چالش روزانه ================= */
      function startDaily() {
        const t = todayStr();
        const r = mulberry(hashStr("flag-" + t));
        const idxs = Array.from({ length: TOTAL }, (_, i) => i);
        for (let i = TOTAL - 1; i > 0; i--) {
          const j = Math.floor(r() * (i + 1));
          [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
        }
        const qs = [];
        for (let q = 0; q < 10; q++) {
          const ci = idxs[q];
          const dis = [],
            used = [ci];
          let guard = 0;
          while (dis.length < 3 && guard++ < 400) {
            const k = Math.floor(r() * TOTAL);
            if (used.indexOf(k) < 0) {
              dis.push(k);
              used.push(k);
            }
          }
          qs.push({ ci, dis });
        }
        const run =
          S.dailyRun &&
          S.dailyRun.d === t &&
          S.dailyRun.pos > 0 &&
          S.dailyRun.pos < 10
            ? S.dailyRun
            : null;
        D = { qs, pos: run ? run.pos : 0, ok: run ? run.ok : 0 };
        GAME = {
          kind: "daily",
          seq: GAME.seq + 1,
          stage: 0,
          cur: 0,
          mistakes: 0,
          answered: false,
          hints: 0,
        };
        nav("game");
        $("#btn-hint").hidden = true;
        if (run) toast("ادامهٔ چالش روزانه", "calendar");
        dNext();
      }
      function dNext() {
        if (!D) return;
        if (D.pos >= 10) {
          dEnd();
          return;
        }
        const q = D.qs[D.pos];
        GAME.cur = q.ci;
        GAME.answered = false;
        GAME.mistakes = 0;
        $("#g-cap").innerHTML =
          'چالش روزانه • سوال <b class="num">' +
          faNum(D.pos + 1) +
          '</b> از <b class="num">۱۰</b>';
        $("#gp-fill").style.width = ((D.pos / 10) * 100).toFixed(1) + "%";
        applyFlag($("#g-flag"), q.ci, true);
        hideCompare();
        buildNameOptions($("#g-options"), q.ci, q.dis, gamePickDaily);
      }
      function gamePickDaily(btn, name) {
        if (
          GAME.answered ||
          btn.disabled ||
          curPage !== "game" ||
          GAME.kind !== "daily"
        )
          return;
        const right = COUNTRIES[GAME.cur][0];
        S.stats.a++;
        const t = todayStr();
        const arr = Array.from($("#g-options").children);
        if (name !== right) {
          GAME.answered = true;
          S.wrongs[COUNTRIES[GAME.cur][1]] =
            (S.wrongs[COUNTRIES[GAME.cur][1]] || 0) + 1;
          D.pos++;
          S.dailyRun = { d: t, pos: D.pos, ok: D.ok };
          save();
          beep("bad");
          vib([50, 60, 50]);
          btn.classList.add("wrong");
          const rb = arr.find((b) => b.dataset.nm === right);
          if (rb) rb.classList.add("correct");
          arr.forEach((b) => {
            b.disabled = true;
            if (b !== btn && b !== rb) b.classList.add("dim");
          });
          showCompare(name);
          const seq = GAME.seq;
          setTimeout(() => {
            if (seq === GAME.seq && GAME.kind === "daily" && D) dNext();
          }, 1800);
          return;
        }
        S.stats.c++;
        S.score += 3;
        D.ok++;
        D.pos++;
        S.dailyRun = { d: t, pos: D.pos, ok: D.ok };
        save();
        paintScore(true);
        beep("ok");
        vib(25);
        floatPts($("#g-flagcard"), "+۳");
        arr.forEach((b) => {
          b.disabled = true;
          if (b !== btn) b.classList.add("dim");
        });
        btn.classList.add("correct");
        const seq = GAME.seq;
        setTimeout(() => {
          if (seq === GAME.seq && GAME.kind === "daily" && D) dNext();
        }, 950);
      }
      function dEnd() {
        const score = D.ok;
        const t = todayStr();
        const y = new Date();
        y.setDate(y.getDate() - 1);
        if (S.lastD !== t) {
          S.streak =
            S.lastD ===
            y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate()
              ? S.streak + 1
              : 1;
          S.lastD = t;
        }
        S.daily = { d: t, s: score };
        S.dailyRun = null;
        S.dailyTotal++;
        save();
        checkBadges();
        if (score >= 8) confetti(80);
        beep("end");
        D = null;
        LAST_SHARE =
          "🏁 چالش روزانه: " +
          faNum(score) +
          " از ۱۰\nزنجیره: " +
          faNum(S.streak) +
          " روز";
        showModal(
          '<div class="stamp gold"><span class="in"><b>' +
            faNum(score) +
            "</b><small>از ۱۰</small></span></div>" +
            '<h3 class="m-title">چالش روزانه</h3>' +
            (score === 10
              ? '<p class="m-rec">' + ic("star") + " بی‌نقص!</p>"
              : "") +
            '<div class="m-stats"><div><b>' +
            faNum(score) +
            "</b><span>درست</span></div><div><b>" +
            faNum(10 - score) +
            "</b><span>غلط</span></div><div><b>" +
            faNum(S.streak) +
            "</b><span>زنجیره</span></div></div>" +
            '<div class="m-btns"><button type="button" class="btn btn-ghost" data-act="share">اشتراک</button>' +
            '<button type="button" class="btn btn-gold" data-act="close">تمام</button></div>',
          true,
        );
      }

      /* ================= چالش‌های زمان‌دار ================= */
      const CHM = {
        normal: {

          key: "best",

      function comboUI() {
        const mult = CH.streak >= 6 ? 3 : CH.streak >= 3 ? 2 : 1;
        $("#ch-combo").textContent = faNum(CH.streak);
        const box = $("#combo-box"),
          mchip = $("#combo-mult");
        box.classList.toggle("fire", mult > 1);
        if (mult > 1) {
          mchip.hidden = false;
          mchip.textContent = "×" + faNum(mult);
        } else mchip.hidden = true;
        return mult;
      }
      function chSnapshot() {
        if (!CH || CH.ended) return;
        if (CH.left < 1500) {
          if (S.chRun[CH.mode]) {
            delete S.chRun[CH.mode];
            save();
          }
          return;
        }
        S.chRun[CH.mode] = {
          mode: CH.mode,
          score: CH.score,
          ok: CH.ok,
          bad: CH.bad,
          asked: CH.asked,
          seen: CH.seen,
          streak: CH.streak,
          left: CH.left,
          cur: CH.cur,
          pos: CH.pos,
          hpos: CH.hpos,
          locked: CH.locked,
          order: CH.order,
          hardOrder: CH.hardOrder,
        };
        save();
      }
      function startChallenge(mode) {
        LAST_MODE = mode;
        chSeq++;
        const id = chSeq;
        if (CH && CH.timer) clearInterval(CH.timer);
        if (document.activeElement && document.activeElement.blur)
          document.activeElement.blur();
        const saved = S.chRun[mode];
        const run =
          saved &&
          saved.left > 1500 &&
          Array.isArray(saved.order) &&
          saved.order.length === TOTAL
            ? saved
            : null;
        delete S.chRun[mode];
        if (run) {
          CH = {
            id,
            mode,
            score: run.score,
            ok: run.ok,
            bad: run.bad,
            asked: run.asked,
            seen: run.seen,
            streak: run.streak,
            ended: false,
            locked: !!run.locked,
            cur: run.cur,
            order: run.order,
            hardOrder: Array.isArray(run.hardOrder)
              ? run.hardOrder
              : shuffle(hardPool.slice()),
            pos: run.pos,
            hpos: run.hpos,
            time: CHM[mode].time,
            left: run.left,
            endAt: Date.now() + run.left,
            timer: null,
          };
          toast("چالش نیمه‌کاره ادامه یافت", "timer");
        } else {
          CH = {
            id,
            mode,
            score: 0,
            ok: 0,
            bad: 0,
            asked: 0,
            seen: 0,
            streak: 0,
            ended: false,
            locked: false,
            cur: 0,
            order: shuffle(Array.from({ length: TOTAL }, (_, i) => i)),
            hardOrder: shuffle(hardPool.slice()),
            pos: 0,
            hpos: 0,
            time: CHM[mode].time,
            left: CHM[mode].time,
            endAt: Date.now() + CHM[mode].time,
            timer: null,
          };
        }
        save();
        hideModal();
        if (curPage !== "challenge") {
          chFrom = curPage === "home" ? "home" : "stages";
        }
        showPage("challenge");
        $("#btn-restart").hidden = false;
        $("#score-chip").hidden = true;
        $("#tb-title").textContent = "چالش: " + CHM[mode].t;
        $("#ch-q").textContent = CHM[mode].q;
        $("#tr-fg").style.stroke = CHM[mode].col;
        $("#ch-score").textContent = faNum(CH.score);
        $("#ch-count").textContent = faNum(CH.asked);
        comboUI();
        $("#ch-time").textContent = faNum(Math.ceil(CH.left / 1000));
        $("#tr-fg").style.strokeDashoffset = (
          125.66 *
          (1 - Math.min(1, CH.left / CH.time))
        ).toFixed(1);
        $("#timer").classList.remove("low");
        if (run) {
          if (CH.locked) chAdvance();
          else renderQ();
        } else chAdvance();
        CH.timer = setInterval(() => {
          if (!CH || CH.ended || CH.id !== id) return;
          const ms = Math.max(0, CH.endAt - Date.now());
          CH.left = ms;
          $("#ch-time").textContent = faNum(Math.ceil(ms / 1000));
          $("#tr-fg").style.strokeDashoffset = (
            125.66 *
            (1 - ms / CH.time)
          ).toFixed(1);
          $("#timer").classList.toggle("low", ms <= 10000 && ms > 0);
          if (ms <= 0) chEnd();
        }, 250);
      }
      function chAdvance() {
        if (!CH || CH.ended) return;
        if (CH.mode === "hard") {
          if (CH.hpos >= CH.hardOrder.length) {
            CH.hardOrder = shuffle(hardPool.slice());
            CH.hpos = 0;
          }
          CH.cur = CH.hardOrder[CH.hpos++];
        } else {
          if (CH.pos >= TOTAL) {
            CH.order = shuffle(CH.order);
            CH.pos = 0;
          }
          CH.cur = CH.order[CH.pos++];
        }
        CH.seen++;
        renderQ();
      }
      function renderQ() {
        if (!CH || CH.ended) return;
        CH.locked = false;
        const m = CH.mode;
        const showFlag = m === "normal" || m === "hard" || m === "type";
        $("#ch-flagcard").hidden = !showFlag;
        $("#ch-prompt").hidden = showFlag;
        $("#ch-options").hidden = m === "type";
        $("#type-box").hidden = m !== "type";
        if (showFlag) {
          applyFlag($("#ch-flag"), CH.cur, true);
        } else if (m === "reverse") {
          $("#ch-psub").innerHTML = ic("flag") + " سرزمین";
          $("#ch-pmain").textContent = COUNTRIES[CH.cur][0];
        } else {
          const inf = infoOf(CH.cur);
          $("#ch-psub").innerHTML = ic("pin") + " پایتخت";
          $("#ch-pmain").textContent = inf[0];
        }
        if (m === "type") {
          const nm = COUNTRIES[CH.cur][0];
          const h = $("#type-hint");
          h.classList.remove("reveal");
          h.textContent =
            "حرف اول: «" +
            nm.charAt(0) +
            "» • " +
            faNum(nm.replace(/[\s\u200c]/g, "").length) +
            " حرف";
          const inp = $("#type-input");
          inp.value = "";
          inp.disabled = false;
          inp.classList.remove("good", "badflash");
          $("#type-send").disabled = false;
          $("#type-skip").disabled = false;
          setTimeout(() => {
            try {
              inp.focus({ preventScroll: true });
            } catch (e) {}
          }, 80);
        } else {
          if (document.activeElement === $("#type-input"))
            document.activeElement.blur();
          const dis = getDistractors(
            CH.cur,
            m === "hard" ? "full" : m === "reverse" ? "one" : "none",
          );
          if (m === "reverse")
            buildFlagOptions($("#ch-options"), CH.cur, dis, chPick);
          else buildNameOptions($("#ch-options"), CH.cur, dis, chPick);
        }
        chSnapshot();
      }
      function chPick(btn, val) {
        if (!CH || CH.ended || CH.locked || btn.disabled) return;
        CH.locked = true;
        CH.asked++;
        S.stats.a++;
        const id = CH.id,
          m = CH.mode;
        const isRight =
          m === "reverse" ? val === CH.cur : val === COUNTRIES[CH.cur][0];
        const arr = Array.from($("#ch-options").children);
        arr.forEach((b) => {
          b.disabled = true;
        });
        if (isRight) {
          S.stats.c++;
          CH.ok++;
          CH.streak++;
          const mult = comboUI();
          CH.score += mult;
          if (CH.streak === 3 || CH.streak === 6) {
            beep("combo");
            vib([25, 40, 25]);
          } else {
            beep("ok");
            vib(20);
          }
          if (CH.streak > S.bestCombo) S.bestCombo = CH.streak;
          CH.left = Math.min(
            CH.time,
            Math.max(0, CH.endAt - Date.now()) + 2000,
          );
          CH.endAt = Date.now() + CH.left;
          timeDelta(true);
          btn.classList.add("correct");
          arr.forEach((b) => {
            if (b !== btn) b.classList.add("dim");
          });
          const s = $("#ch-score");
          s.textContent = faNum(CH.score);
          s.classList.remove("pop");
          void s.offsetWidth;
          s.classList.add("pop");
          floatPts(
            m === "reverse" || m === "capital"
              ? $("#ch-prompt")
              : $("#ch-flagcard"),
            "+" + faNum(mult),
          );
        } else {
          S.wrongs[COUNTRIES[CH.cur][1]] =
            (S.wrongs[COUNTRIES[CH.cur][1]] || 0) + 1;
          CH.bad++;
          CH.streak = 0;
          comboUI();
          CH.left = Math.max(1000, Math.max(0, CH.endAt - Date.now()) - 2000);
          CH.endAt = Date.now() + CH.left;
          timeDelta(false);
          btn.classList.add("wrong");
          const rb =
            m === "reverse"
              ? arr.find((b) => +b.dataset.idx === CH.cur)
              : arr.find((b) => b.dataset.nm === COUNTRIES[CH.cur][0]);
          if (rb) rb.classList.add("correct");
          arr.forEach((b) => {
            if (b !== btn && b !== rb) b.classList.add("dim");
          });
          beep("bad");
          vib([50, 50, 50]);
        }
        save();
        chSnapshot();
        $("#ch-count").textContent = faNum(CH.asked);
        setTimeout(() => {
          if (CH && CH.id === id && !CH.ended) chAdvance();
        }, 620);
      }
      function chTypeSubmit() {
        if (!CH || CH.ended || CH.locked || CH.mode !== "type") return;
        const inp = $("#type-input");
        const v = normFa(inp.value);
        if (!v) return;
        const right = normFa(COUNTRIES[CH.cur][0]);
        if (v === right || (right.length >= 6 && lev1(v, right))) {
          CH.locked = true;
          CH.asked++;
          S.stats.a++;
          S.stats.c++;
          CH.ok++;
          CH.streak++;
          const mult = comboUI();
          CH.score += mult;
          CH.left = Math.min(
            CH.time,
            Math.max(0, CH.endAt - Date.now()) + 2000,
          );
          CH.endAt = Date.now() + CH.left;
          timeDelta(true);
          inp.classList.add("good");
          inp.disabled = true;
          $("#type-send").disabled = true;
          $("#type-skip").disabled = true;
          beep("ok");
          vib(20);
          $("#ch-score").textContent = faNum(CH.score);
          floatPts($("#ch-flagcard"), "+" + faNum(mult));
          const id = CH.id;
          save();
          chSnapshot();
          $("#ch-count").textContent = faNum(CH.asked);
          setTimeout(() => {
            if (CH && CH.id === id && !CH.ended) chAdvance();
          }, 620);
        } else {
          beep("bad");
          vib([40, 40, 40]);
          inp.classList.add("badflash");
          setTimeout(() => inp.classList.remove("badflash"), 480);
          CH.left = Math.max(1000, Math.max(0, CH.endAt - Date.now()) - 2000);
          CH.endAt = Date.now() + CH.left;
          timeDelta(false);
        }
      }

      });
      $("#btn-badges").addEventListener("click", showBadges);
      $("#btn-stats").addEventListener("click", showStats);
      $("#btn-reset").addEventListener("click", () => {
        showModal(
          '<div class="m-warn">' +
            ic("warn") +
            '</div><h3 class="m-title">شروع دوباره؟</h3><p class="m-text">همه پیشرفت پاک می‌شود؛ رکوردها و نشان‌ها می‌مانند.</p><div class="m-btns"><button type="button" class="btn btn-danger" data-act="reset">بله</button><button type="button" class="btn btn-ghost" data-act="close">انصراف</button></div>',
        );
      });
      $("#btn-continue").addEventListener("click", () => {
        if (S.done < TOTAL) openGame(S.done);
        else finalModal();
      });
      $("#btn-hint").addEventListener("click", useHint);
      $("#grid").addEventListener("click", (e) => {
        const cell = e.target.closest(".cell");
        if (!cell) return;
        const i = +cell.dataset.i,
          st = cell.dataset.s;
        if (st === "open") openGame(i);
        else if (st === "done") peekModal(i);
        else if (st === "special") finalModal();
      });
      $("#btn-restart").addEventListener("click", () => {
        if (curPage !== "challenge" || !CH || CH.ended) return;
        if (CH.timer) clearInterval(CH.timer);
        if (S.chRun[CH.mode]) {
          delete S.chRun[CH.mode];
          save();
        }
        vib(30);
        toast("چالش از نو شروع شد!", "reset");
        startChallenge(LAST_MODE);
      });
      $("#type-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          chTypeSubmit();
        }
      });
      $("#type-send").addEventListener("click", chTypeSubmit);
      $("#type-skip").addEventListener("click", chTypeSkip);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalOpen()) hideModal();
          return;
        }
        const ae = document.activeElement;
        if (ae && ae.tagName === "INPUT") return;
        const k = parseInt(e.key, 10);
        if (k >= 1 && k <= 4) {
          const box =
            curPage === "game"
              ? $("#g-options")
              : curPage === "challenge"
                ? $("#ch-options")
                : null;
          if (box) {
            const btn = box.children[k - 1];
            if (btn && !btn.disabled) btn.click();
          }
        }
      });
      function paintSound() {
        const b = $("#btn-sound");
        b.classList.toggle("off", S.mute);
        b.setAttribute("aria-pressed", S.mute ? "true" : "false");
        b.innerHTML =
          '<span class="eq' +
          (S.mute ? " off" : "") +
          '"><i></i><i></i><i></i><i></i></span>';
      }
      $("#btn-sound").addEventListener("click", () => {
        S.mute = !S.mute;
        save();
        paintSound();
        if (!S.mute) beep("ok");
      });

      /* ================= PWA ================= */
      const LOGO_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#f5b042"/><rect x="7" y="7" width="106" height="106" rx="21" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="1 7.5" stroke-linecap="round"/><circle cx="30" cy="19" r="5" fill="#fff"/><line x1="30" y1="24" x2="30" y2="104" stroke="#fff" stroke-width="6" stroke-linecap="round"/><clipPath id="c"><path d="M34 27 C48 22 56 32 86 26 L86 66 C56 72 48 62 34 68 Z"/></clipPath><g clip-path="url(#c)"><rect x="30" y="14" width="20" height="66" fill="#2b2f38"/><rect x="50" y="14" width="20" height="66" fill="#ffffff"/><rect x="70" y="14" width="20" height="66" fill="#2b2f38"/></g><line x1="91" y1="91" x2="103" y2="103" stroke="#2b2f38" stroke-width="9" stroke-linecap="round"/><circle cx="78" cy="78" r="19" fill="#fff"/><circle cx="78" cy="78" r="19" fill="none" stroke="#2b2f38" stroke-width="6"/><path d="M72 71.6 C72 68 74.7 65.6 78 65.6 C81.3 65.6 83.9 67.9 83.9 71.2 C83.9 75.8 79.3 76.6 78.4 81" fill="none" stroke="#2b2f38" stroke-width="5" stroke-linecap="round"/><circle cx="78.1" cy="89" r="2.9" fill="#2b2f38"/><path d="M97 29 l1.9 4.7 4.7 1.9 -4.7 1.9 -1.9 4.7 -1.9 -4.7 -4.7 -1.9 4.7 -1.9 z" fill="#fff" opacity=".9"/></svg>';
      function initApp() {
        $("#favicon").href =
          "data:image/svg+xml;charset=utf-8," + encodeURIComponent(LOGO_SVG);
        if (
          "serviceWorker" in navigator &&
          /^https?:$/.test(location.protocol)
        ) {
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("sw.js")
              .then(() => {
                navigator.serviceWorker.ready.then((reg) => {
                  const target = reg.active || reg.waiting || reg.installing;
                  if (target) {
                    const urls = [
                      "./",
                      "./index.html",
                      "./manifest.json",
                    ].concat(COUNTRIES.map((c) => "svg/" + c[1] + ".svg"));
                    target.postMessage({ type: "PRECACHE", urls: urls });
                  }
                });
              })
              .catch(() => {});
          });
          navigator.serviceWorker.addEventListener("message", (e) => {
            if (e.data && e.data.type === "OFFLINE_READY")
              toast("آفلاین آماده شد", "check");
          });
        }
      }

      /* ================= راه‌اندازی ================= */
      loadState();
      buildGrid();
      refreshGrid();
      buildFlagRow();
      paintSound();
      $("#tool-bic").innerHTML = ic("trophy");
      $("#tool-sic").innerHTML = ic("chart");
      $("#total-flags").textContent = faNum(TOTAL);
      paintScore(false);
      checkBadges();
      if (!S.visited) {
        S.visited = true;
        save();
        setTimeout(() => toast("خوش آمدی!", "flag"), 900);
      }
      try {
        history.replaceState({ p: "home" }, "", location.href);
      } catch (e) {}
      initApp();
    </script>
  </body>
</html>
