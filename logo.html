<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>لوگوی «تشخیص پرچم» — بزرگ با کیفیت</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Tahoma, sans-serif;
        direction: rtl;
        background: #f8f8fc;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .box {
        background: #fff;
        border: 1px solid #e6e7ee;
        border-radius: 24px;
        padding: 30px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.15);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
        color: #2b2f38;
      }
      p {
        color: #71757f;
        font-size: 13px;
        line-height: 1.8;
        margin: 0 0 20px;
      }
      #canvas-holder {
        display: grid;
        place-items: center;
        margin: 0 0 20px;
        background: #f6f7fb;
        border-radius: 16px;
        padding: 20px;
      }
      canvas {
        max-width: 100%;
        height: auto;
        border-radius: 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
      }
      button {
        background: #f5b042;
        color: #4a3200;
        border: none;
        border-radius: 13px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.2s;
      }
      button:active {
        transform: scale(0.95);
      }
      button.ghost {
        background: #fff;
        border: 1.5px solid #e6e7ee;
        color: #2b2f38;
      }
      select {
        background: #fff;
        border: 1.5px solid #e6e7ee;
        color: #2b2f38;
        border-radius: 13px;
        padding: 12px 16px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .done {
        color: #2c7a33;
        font-weight: 800;
        margin-top: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>🚩 لوگوی «تشخیص پرچم»</h1>
      <p>
        اندازه را انتخاب کن و دکمه دانلود را بزن — یا روی لوگو راست‌کلیک کن و
        «ذخیره تصویر» را بزن
      </p>

      <div id="canvas-holder">
        <canvas id="logo-canvas" width="512" height="512"></canvas>
      </div>

      <div class="controls">
        <select id="size-select">
          <option value="512">۵۱۲ × ۵۱۲</option>
          <option value="1024">۱۰۲۴ × ۱۰۲۴</option>
          <option value="2048">۲۰۴۸ × ۲۰۴۸ (کیفیت بالا)</option>
        </select>
        <button onclick="download()">📥 دانلود PNG</button>
        <button onclick="downloadIcons()" class="ghost">
          📦 دانلود ۳ آیکون PWA
        </button>
      </div>

      <div class="done" id="ok">✅ دانلود شد!</div>
    </div>

    <script>
      const C1 = "#2b2f38",
        C2 = "#ffffff",
        C3 = "#2b2f38";

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawLogo(ctx, size, inner) {
        const s = size / 120;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, size, size);
        ctx.scale(s, s);

        // پس‌زمینه طلایی
        ctx.fillStyle = "#f5b042";
        roundRect(ctx, 0, 0, 120, 120, 28);
        ctx.fill();

        ctx.save();
        if (inner) {
          ctx.translate(13.2, 13.2);
          ctx.scale(0.78, 0.78);
        }

        // حاشیه سفید نقطه‌چین
        ctx.strokeStyle = "rgba(255,255,255,.75)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([1, 7.5]);
        ctx.lineCap = "round";
        roundRect(ctx, 7, 7, 106, 106, 21);
        ctx.stroke();
        ctx.setLineDash([]);

        // میله سفید
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(30, 24);
        ctx.lineTo(30, 104);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(30, 19, 5, 0, 6.3);
        ctx.fill();

        // پرچم سه‌رنگ: #2B2F38 / سفید / #2B2F38
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(34, 27);
        ctx.bezierCurveTo(48, 22, 56, 32, 86, 26);
        ctx.lineTo(86, 66);
        ctx.bezierCurveTo(56, 72, 48, 62, 34, 68);
        ctx.closePath();
        ctx.clip();

        ctx.fillStyle = C1;
        ctx.fillRect(30, 14, 20, 66);
        ctx.fillStyle = C2;
        ctx.fillRect(50, 14, 20, 66);
        ctx.fillStyle = C3;
        ctx.fillRect(70, 14, 20, 66);
        ctx.restore();

        // ذره‌بین
        ctx.strokeStyle = "#2b2f38";
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(91, 91);
        ctx.lineTo(103, 103);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(78, 78, 19, 0, 6.3);
        ctx.fill();

        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(78, 78, 19, 0, 6.3);
        ctx.stroke();

        // علامت سؤال
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(72, 71.6);
        ctx.bezierCurveTo(72, 68, 74.7, 65.6, 78, 65.6);
        ctx.bezierCurveTo(81.3, 65.6, 83.9, 67.9, 83.9, 71.2);
        ctx.bezierCurveTo(83.9, 75.8, 79.3, 76.6, 78.4, 81);
        ctx.stroke();

        ctx.fillStyle = "#2b2f38";
        ctx.beginPath();
        ctx.arc(78.1, 89, 2.9, 0, 6.3);
        ctx.fill();

        ctx.restore();
      }

      function download() {
        const size = parseInt(document.getElementById("size-select").value);
        const c = document.createElement("canvas");
        c.width = c.height = size;
        drawLogo(c.getContext("2d"), size, false);
        const a = document.createElement("a");
        a.href = c.toDataURL("image/png");
        a.download = "flag-logo-" + size + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        showDone();
      }

      function downloadIcons() {
        const sizes = [
          { s: 192, n: "icon-192.png", inner: false },
          { s: 512, n: "icon-512.png", inner: false },
          { s: 512, n: "icon-maskable-512.png", inner: true },
        ];
        sizes.forEach((item, k) => {
          setTimeout(() => {
            const c = document.createElement("canvas");
            c.width = c.height = item.s;
            drawLogo(c.getContext("2d"), item.s, item.inner);
            const a = document.createElement("a");
            a.href = c.toDataURL("image/png");
            a.download = item.n;
            document.body.appendChild(a);
            a.click();
            a.remove();
            if (k === sizes.length - 1) showDone();
          }, k * 400);
        });
      }

      function showDone() {
        document.getElementById("ok").style.display = "block";
        setTimeout(
          () => (document.getElementById("ok").style.display = "none"),
          3000,
        );
      }

      // نمایش اولیه
      function render() {
        const c = document.getElementById("logo-canvas");
        drawLogo(c.getContext("2d"), 512, false);
      }
      render();
      document.getElementById("size-select").addEventListener("change", render);
    </script>
  </body>
</html>
